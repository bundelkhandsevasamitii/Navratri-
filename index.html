<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navratri — Line by Line Drawing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#ffe1a0;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 10px;background:#080b13;border-bottom:1px solid #a87b2d}
h1{margin:0;color:#ffcb51;font-size:clamp(23px,5vw,36px)}
header p{margin:8px 0 0;color:#f4dfb4}
.controls{padding:14px 8px}
button{border:1px solid #ffcf57;background:#191b27;color:#ffda78;padding:12px 17px;border-radius:24px;font-size:15px;margin:4px;cursor:pointer}
button:hover{background:#ffca4a;color:#111}
#status{min-height:24px;font-size:14px;color:#ffe9b8;padding:3px}
.frame{width:min(94vw,520px);margin:0 auto 18px;border:1px solid #c99a3c;border-radius:8px;overflow:hidden;box-shadow:0 0 24px #0008;background:#ead8b7}
svg{display:block;width:100%;height:auto}
.paper{fill:#ead8b7}

/* Smooth continuous drawing effect fix */
.ink{
  fill: none;
  stroke: #201c18;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 4000;
  stroke-dashoffset: 4000;
  animation: drawLine 15s linear forwards;
}
.ink.red{stroke:#a82328}

@keyframes drawLine {
  to {
    stroke-dashoffset: 0;
  }
}

#progress{height:5px;background:#272316;width:min(94vw,520px);margin:0 auto 15px;border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:#ffc642;transition:width .1s linear}
footer{padding:17px;color:#ffcf5b;border-top:1px solid #55421f}
.small{font-size:12px;color:#cdbb95;line-height:1.5;padding:0 14px 15px}
</style>
</head>
<body>
<header><h1>🔱 Navratri Special 🔱</h1><p>माँ दुर्गा और शेर — निरंतर और धीमी गति से पेंसिल ड्राइंग प्रभाव</p></header>
<div class="controls">
<button id="start">▶ Start Drawing</button>
<button id="pause">⏸ Pause</button>
<button id="replay">↻ Replay</button>
<div id="status">ड्राइंग शुरू हो रही है...</div>
</div>
<div id="progress"><div id="bar"></div></div>
<div class="frame">
