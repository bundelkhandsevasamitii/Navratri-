function prep(){
  paths.forEach(p=>{p.style.opacity=0;p.style.strokeDasharray='none';p.style.strokeDashoffset=0;p.style.transition='none';});
  i=0;bar.style.width='0%';paused=false;running=false;
  document.getElementById('pause').textContent='⏸ Pause';
}
function next(){
  if(paused||!running)return;
  if(i>=paths.length){
    running=false;statusEl.textContent='🌺 पूरी ड्रॉइंग तैयार — जय माता दी!';
    bar.style.width='100%';return;
  }
  const p=paths[i++];
  let len;
  try{len=p.getTotalLength()}catch(e){len=50}
  p.style.opacity=1;
  p.style.strokeDasharray=len;
  p.style.strokeDashoffset=len;
  const duration=Math.max(180,Math.min(850,len*1.25));
  p.style.transition=`stroke-dashoffset ${duration}ms linear`;
  requestAnimationFrame(()=>{p.style.strokeDashoffset=0;});
  bar.style.width=(i/paths.length*100)+'%';
  statusEl.textContent=`✍️ लाइन-दर-लाइन ड्रॉइंग: ${Math.round(i/paths.length*100)}%`;
  timer=setTimeout(next,duration+delay);
}
function start(){
  if(running&&!paused)return;
  running=true;paused=false;
  document.getElementById('pause').textContent='⏸ Pause';
  next();
}
function togglePause(){
  if(!running&&i>=paths.length){prep();start();return}
  paused=!paused;
  document.getElementById('pause').textContent=paused?'▶ Resume':'⏸ Pause';
  if(paused){
    clearTimeout(timer);
    // freeze the currently animating stroke at its visible position
    paths.forEach(p=>{
      const cs=getComputedStyle(p);
      if(cs.opacity==='1' && p.style.transition!=='none'){
        const off=cs.strokeDashoffset;
        p.style.transition='none';p.style.strokeDashoffset=off;
      }
    });
    statusEl.textContent='⏸ ड्रॉइंग रोक दी गई है';
  }else{start()}
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('pause').addEventListener('click',togglePause);
document.getElementById('replay').addEventListener('click',()=>{clearTimeout(timer);prep();start();});
prep();
</script>
</body></html>
